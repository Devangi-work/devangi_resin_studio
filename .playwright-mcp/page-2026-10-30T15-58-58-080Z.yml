          - generic [ref=f2e541]: Handcrafted Longevity
        - generic [ref=f2e542]:
          - heading "Treasured Handcrafted Keepsakes, Preserved Forever" [level=3] [ref=f2e543]
          - paragraph [ref=f2e544]: Every piece from Devangi Resin Studio is handcrafted with passion, real botanicals, gold leaf accents, and high-clarity epoxy resin. With basic gentle care, your resin art will remain as sparkling and vibrant as the day it arrived.
        - generic [ref=f2e545]:
          - generic [ref=f2e546]:
            - generic [ref=f2e547]: Preservation
            - heading "1. Sunlight & UV Preservation" [level=4] [ref=f2e556]
            - paragraph [ref=f2e557]: Our creations are crafted with premium UV-stabilized optical-grade epoxy resin to prevent yellowing over time. To maintain crystal-clear transparency and floral vibrancy for decades, display your pieces indoors away from prolonged harsh direct midday sunlight.
          - generic [ref=f2e558]:
            - generic [ref=f2e559]: Thermal Safety
            - heading "2. Heat Resistance Guidelines" [level=4] [ref=f2e564]
            - paragraph [ref=f2e565]: Fully cured resin coasters and trays easily withstand warm mugs of coffee and tea up to 50°C (122°F). However, avoid placing boiling cookware, sizzling frying pans, or open flames directly onto the surface to prevent thermal softening.
          - generic [ref=f2e566]:
            - generic [ref=f2e567]: Daily Care
            - heading "3. Gentle Cleaning & Polishing" [level=4] [ref=f2e573]
            - paragraph [ref=f2e574]: Wipe clean using a soft, non-abrasive microfiber cloth dampened with lukewarm water and mild dish soap. Never use acetone, alcohol, bleach, ammonia, or harsh scrubbing pads, as they will dull the glass-like mirror sheen.
          - generic [ref=f2e575]:
            - generic [ref=f2e576]: Waterproof
            - heading "4. Water & Moisture Resistance" [level=4] [ref=f2e582]
            - paragraph [ref=f2e583]: Our resin pieces undergo a meticulous 72-hour multi-stage curing process, making them completely waterproof and impervious to cold beverage condensation, spills, and humidity.
          - generic [ref=f2e584]:
            - generic [ref=f2e585]: Artisan Secret
            - heading "5. Restoring Brilliant Glass Shine" [level=4] [ref=f2e590]
            - paragraph [ref=f2e591]: If minor surface smudges or micro-dulling occur after extended use, gently buff the surface with a clean microfiber cloth and a drop of plastic polish or pure mineral oil to bring back the brilliant high-gloss showroom finish.
